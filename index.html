<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point Your View</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Point Your View</h1>
  </header>

  <main class="container">
    <section class="create-post">
      <h3>Share Your View</h3>
      <input type="text" id="usernameInput" placeholder="Your Name" class="input-field">
      <textarea id="postInput" placeholder="What's on your mind?"></textarea>
      <button id="postBtn">Post</button>
    </section>

    <section class="feed">
      <h2>Feed</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
